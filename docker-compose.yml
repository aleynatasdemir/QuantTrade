version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: quanttrade-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quanttrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quanttrade123}
      POSTGRES_DB: ${POSTGRES_DB:-quanttrade}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quanttrade}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quanttrade-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-quanttrade}:${POSTGRES_PASSWORD:-quanttrade123}@db:5432/${POSTGRES_DB:-quanttrade}
      - EVDS_API_KEY=${EVDS_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./data:/app/data:ro
      - ./src:/app/src:ro
      - ./config:/app/config:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quanttrade-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  # Telegram Bot (Command Handler)
  telegram:
    build:
      context: .
      dockerfile: ./live-telegram/Dockerfile.full
    container_name: quanttrade-telegram
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EVDS_API_KEY=${EVDS_API_KEY}
      - BACKEND_API_URL=http://backend:8000
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./backend/data:/app/backend/data
      - telegram_state:/app/live-telegram
    depends_on:
      - backend

volumes:
  postgres_data:
  telegram_state:
